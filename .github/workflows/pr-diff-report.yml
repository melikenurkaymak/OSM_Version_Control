name: PR Visual Diff Report

# When a .osm file changes in a PR, automatically builds a before/after
# interactive HTML report and leaves a download link as a PR comment.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.osm"

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout after (head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0

      - name: Checkout before (base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find changed .osm files
        id: changed
        run: |
          FILES=$(diff -rq base head 2>/dev/null \
            | grep '\.osm$' \
            | sed -E 's/^Files (base\/.*) and head\/.* differ$/\1/' \
            | sed 's|^base/||')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate diff reports
        run: |
          mkdir -p reports
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(basename "$f" .osm)
            echo "Processing: $f"
            python3 head/tools/pr_diff/export_json.py "base/$f" "head/$f" "reports/${name}_diff.json"
            python3 head/tools/pr_diff/build_report.py \
              head/tools/pr_diff/viewer_template.html \
              "reports/${name}_diff.json" \
              "reports/${name}_diff.html"
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanelet-diff-report-pr${{ github.event.pull_request.number }}
          path: reports/*.html
          retention-days: 30

      - name: Post info comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "🗺️ **Visual diff report is ready.**",
                "",
                `To inspect the lanelet changes in this PR with pan/zoom: [open the workflow run](${runUrl}) → download \`lanelet-diff-report-pr${context.issue.number}\` from the **Artifacts** section at the bottom of the page, unzip it, and open the \`.html\` file in your browser.`,
                "",
                "No extra setup needed; the data is embedded in the file and nothing is sent anywhere."
              ].join("\n")
            });
