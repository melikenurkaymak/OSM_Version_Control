name: PR Visual Diff Report

# When a .osm file is added or changed in a PR (into any branch -- a project
# branch like "albus" or the final PR into main), automatically builds a
# before/after interactive HTML report and leaves a download link as a PR
# comment.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.osm"

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find changed .osm files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # git diff (not `diff -rq` on two checkouts) so this correctly
          # finds files even when an entire new folder is added -- e.g. a
          # brand-new route folder merged into main for the first time.
          FILES=$(git diff --name-only --diff-filter=AM --no-renames "$BASE_SHA" "$HEAD_SHA" -- '*.osm')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate diff reports
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports before
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(echo "$f" | sed 's/\.osm$//; s#/#__#g')
            mkdir -p "before/$(dirname "$f")"
            if ! git show "$BASE_SHA:$f" > "before/$f" 2>/dev/null; then
              # File didn't exist on the base branch (e.g. a brand-new route
              # being merged for the first time) -- treat "before" as an
              # empty map, so every way in it correctly shows as "added".
              echo '<?xml version="1.0" encoding="UTF-8"?><osm version="0.6"></osm>' > "before/$f"
            fi
            echo "Processing: $f"
            python3 tools/pr_diff/export_json.py "before/$f" "$f" "reports/${name}_diff.json"
            python3 tools/pr_diff/build_report.py \
              tools/pr_diff/viewer_template.html \
              "reports/${name}_diff.json" \
              "reports/${name}_diff.html"
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanelet-diff-report-pr${{ github.event.pull_request.number }}
          path: reports/*.html
          retention-days: 30

      - name: Post info comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                "🗺️ **Visual diff report is ready.**",
                "",
                `To inspect the lanelet changes in this PR with pan/zoom: [open the workflow run](${runUrl}) → download \`lanelet-diff-report-pr${context.issue.number}\` from the **Artifacts** section at the bottom of the page, unzip it, and open the \`.html\` file in your browser.`,
                "",
                "No extra setup needed; the data is embedded in the file and nothing is sent anywhere."
              ].join("\n")
            });
