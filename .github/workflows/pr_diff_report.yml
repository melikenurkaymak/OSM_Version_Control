name: PR Visual Diff Report

# Runs on every PR (no `paths` filter at the trigger level -- see note
# below) into any branch. When a .osm file is added or changed, builds a
# before/after interactive HTML report and publishes it to GitHub Pages,
# then leaves a direct link (no zip, no download) as a PR comment.
# Otherwise it succeeds immediately with nothing to do.
#
# Why no `paths` filter here: a workflow with a `paths` filter simply does
# not run for PRs that don't touch a matching file. If this job is later
# marked as a required status check in branch protection, a PR that
# doesn't touch any .osm file would then show "Expected — waiting for
# status to be reported" forever, permanently blocking merge. Checking the
# changed files inside the job (see the first step) avoids that trap while
# keeping the same "only do work when .osm files changed" behavior.
#
# One-time setup this workflow needs (see also the "Deploy report to
# GitHub Pages" step below): the first successful run creates a
# `gh-pages` branch. After that first run, go to
# Settings -> Pages -> Build and deployment -> Source: "Deploy from a
# branch" -> Branch: `gh-pages` / `/ (root)` -> Save. Every run after that
# publishes straight to a live URL, no manual step needed again.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  diff-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Find changed .osm files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # git diff (not `diff -rq` on two checkouts) so this correctly
          # finds files even when an entire new folder is added -- e.g. a
          # brand-new route folder merged into main for the first time.
          FILES=$(git diff --name-only --diff-filter=AM --no-renames "$BASE_SHA" "$HEAD_SHA" -- '*.osm')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No changed .osm files in this PR -- nothing to do."
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate diff reports
        if: steps.changed.outputs.any == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports before
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(echo "$f" | sed 's/\.osm$//; s#/#__#g')
            mkdir -p "before/$(dirname "$f")"
            if ! git show "$BASE_SHA:$f" > "before/$f" 2>/dev/null; then
              # File didn't exist on the base branch (e.g. a brand-new route
              # being merged for the first time) -- treat "before" as an
              # empty map, so every way in it correctly shows as "added".
              echo '<?xml version="1.0" encoding="UTF-8"?><osm version="0.6"></osm>' > "before/$f"
            fi
            echo "Processing: $f"
            python3 tools/pr_diff/export_json.py "before/$f" "$f" "reports/${name}_diff.json"
            python3 tools/pr_diff/build_report.py \
              tools/pr_diff/viewer_template.html \
              "reports/${name}_diff.json" \
              "reports/${name}_diff.html"
            # Drop the intermediate .json -- only the .html report gets published.
            rm -f "reports/${name}_diff.json"
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Deploy report to GitHub Pages
        if: steps.changed.outputs.any == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
          commit_message: "Publish diff report for PR #${{ github.event.pull_request.number }}"

      - name: Post info comment on PR
        if: steps.changed.outputs.any == 'true'
        env:
          FILES: ${{ steps.changed.outputs.files }}
        uses: actions/github-script@v7
        with:
          script: |
            const files = process.env.FILES.split("\n").filter(Boolean);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNum = context.issue.number;
            const base = `https://${owner}.github.io/${repo}/pr-${prNum}`;
            const links = files.map(f => {
              const name = f.replace(/\.osm$/, "").replace(/\//g, "__");
              return `- [${f}](${base}/${name}_diff.html)`;
            }).join("\n");
            github.rest.issues.createComment({
              owner, repo, issue_number: prNum,
              body: [
                "🗺️ **Visual diff report is ready.**",
                "",
                links,
                "",
                "Click a link above to open the interactive pan/zoom viewer directly in your browser -- no download, no zip.",
                "The data is embedded in the page and nothing is sent anywhere."
              ].join("\n")
            });
