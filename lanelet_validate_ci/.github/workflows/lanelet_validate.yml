name: Lanelet2 Validation

on:
  pull_request:
    paths:
      - 'routes/**/*.osm'

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install git and pip
        run: apt-get update && apt-get install -y git python3-pip

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install lanelet2
        run: pip install lanelet2

      - name: Validate changed .osm files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FAILED=0
          # SHA-based diff (not a branch name) so this works the same way
          # whether the PR targets a project branch (e.g. "albus") or main.
          CHANGED=$(git diff --name-only --diff-filter=AM --no-renames "$BASE_SHA" "$HEAD_SHA" -- 'routes/**/*.osm')
          if [ -z "$CHANGED" ]; then echo "No changed .osm files."; exit 0; fi
          for f in $CHANGED; do
            echo "== $f =="
            lanelet2_validate --map_file="$f" --lat=<your_map_origin_lat> --lon=<your_map_origin_lon> || FAILED=1
          done
          exit $FAILED
